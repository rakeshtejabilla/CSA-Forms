services:
  - type: web
    name: form-builder-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set this to https://form-builder-backend.onrender.com/api
      - key: VITE_WS_URL
        sync: false  # Set this to wss://form-builder-backend.onrender.com
